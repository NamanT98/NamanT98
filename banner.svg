<svg width="800" height="250" viewBox="0 0 800 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Glow Effect Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <style>
    /* Text Fade-In Keyframes */
    @keyframes fadeInText {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#textGrad);
      opacity: 0;
      animation: fadeInText 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .subtitle {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
      opacity: 0;
      animation: fadeInText 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
    }
    .desc-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #64748b;
      opacity: 0;
      animation: fadeInText 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }
    .grid-lines {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.08;
    }

    /* Ambient Blobs Pulsing Opacity */
    @keyframes pulseBlob1 {
      0%, 100% { opacity: 0.12; }
      50% { opacity: 0.20; }
    }
    @keyframes pulseBlob2 {
      0%, 100% { opacity: 0.08; }
      50% { opacity: 0.15; }
    }
    .blob1 { animation: pulseBlob1 8s ease-in-out infinite; }
    .blob2 { animation: pulseBlob2 10s ease-in-out infinite; }

    /* Background Clusters Floating Animations */
    @keyframes float1 {
      0%, 100% { transform: translate(120px, 50px) rotate(0deg); }
      33% { transform: translate(140px, 70px) rotate(15deg); }
      66% { transform: translate(100px, 90px) rotate(-10deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(400px, 160px) rotate(0deg); }
      50% { transform: translate(440px, 120px) rotate(-20deg); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(650px, 70px) rotate(0deg); }
      33% { transform: translate(610px, 100px) rotate(12deg); }
      66% { transform: translate(670px, 50px) rotate(-8deg); }
    }
    @keyframes float4 {
      0%, 100% { transform: translate(320px, 40px) rotate(0deg); }
      50% { transform: translate(350px, 80px) rotate(25deg); }
    }
    @keyframes float5 {
      0%, 100% { transform: translate(480px, 50px) rotate(0deg); }
      50% { transform: translate(510px, 30px) rotate(-15deg); }
    }
    @keyframes float6 {
      0%, 100% { transform: translate(680px, 160px) rotate(0deg); }
      50% { transform: translate(660px, 180px) rotate(10deg); }
    }
    @keyframes float7 {
      0%, 100% { transform: translate(80px, 160px) rotate(0deg); }
      50% { transform: translate(100px, 140px) rotate(-10deg); }
    }

    .cluster1 { animation: float1 28s ease-in-out infinite; }
    .cluster2 { animation: float2 32s ease-in-out infinite; }
    .cluster3 { animation: float3 30s ease-in-out infinite; }
    .cluster4 { animation: float4 26s ease-in-out infinite; }
    .cluster5 { animation: float5 29s ease-in-out infinite; }
    .cluster6 { animation: float6 31s ease-in-out infinite; }
    .cluster7 { animation: float7 27s ease-in-out infinite; }

    /* Background Connection Bonds (Forming & Breaking) */
    .bg-bond {
      stroke-width: 1;
      stroke-dasharray: 4, 3;
      animation: bgBondFlow 3s linear infinite, bgBondPulse1 8s ease-in-out infinite alternate;
    }
    .bg-bond-alt {
      stroke-width: 1;
      stroke-dasharray: 3, 2;
      animation: bgBondFlow 2.5s linear infinite, bgBondPulse2 10s ease-in-out infinite alternate;
    }

    @keyframes bgBondFlow {
      to { stroke-dashoffset: -20; }
    }
    @keyframes bgBondPulse1 {
      0%, 100% { opacity: 0.05; }
      50% { opacity: 0.40; }
    }
    @keyframes bgBondPulse2 {
      0%, 100% { opacity: 0.40; }
      50% { opacity: 0.05; }
    }

    /* Background Atoms Pulsing */
    .bg-node {
      stroke-width: 1.5;
      fill: #0a0f1d;
      animation: bgNodePulse 5s ease-in-out infinite alternate;
    }
    .node-blue { stroke: #3b82f6; }
    .node-purple { stroke: #8b5cf6; }
    .node-pink { stroke: #ec4899; }
    .node-teal { stroke: #14b8a6; }

    @keyframes bgNodePulse {
      0% { r: 3.5; opacity: 0.25; }
      100% { r: 5.5; opacity: 0.75; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="250" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <circle cx="120" cy="60" r="90" fill="#3b82f6" class="blob1" filter="url(#softGlow)" />
  <circle cx="680" cy="180" r="110" fill="#ec4899" class="blob2" filter="url(#softGlow)" />

  <!-- Grid Pattern -->
  <g class="grid-lines">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200" />
    <path d="M 100,0 L 100,250 M 200,0 L 200,250 M 300,0 L 300,250 M 400,0 L 400,250 M 500,0 L 500,250 M 600,0 L 600,250 M 700,0 L 700,250" />
  </g>

  <!-- BACKGROUND FLOATING MESH NETWORK (Atoms & Bonds forming/breaking) -->

  <!-- Cluster 1 (Left-Center) -->
  <g class="cluster1">
    <line x1="0" y1="0" x2="60" y2="30" stroke="#3b82f6" class="bg-bond" />
    <line x1="60" y1="30" x2="25" y2="-40" stroke="#8b5cf6" class="bg-bond-alt" />
    <line x1="25" y1="-40" x2="0" y2="0" stroke="#ec4899" class="bg-bond" />
    <circle cx="0" cy="0" r="4.5" class="bg-node node-blue" />
    <circle cx="60" cy="30" r="4.5" class="bg-node node-purple" />
    <circle cx="25" cy="-40" r="4.5" class="bg-node node-pink" />
  </g>

  <!-- Cluster 2 (Center-Bottom) -->
  <g class="cluster2">
    <line x1="0" y1="0" x2="-70" y2="-30" stroke="#8b5cf6" class="bg-bond-alt" />
    <line x1="-70" y1="-30" x2="-20" y2="45" stroke="#14b8a6" class="bg-bond" />
    <line x1="-20" y1="45" x2="0" y2="0" stroke="#3b82f6" class="bg-bond-alt" />
    <circle cx="0" cy="0" r="4.5" class="bg-node node-purple" />
    <circle cx="-70" cy="-30" r="4.5" class="bg-node node-teal" />
    <circle cx="-20" cy="45" r="4.5" class="bg-node node-blue" />
  </g>

  <!-- Cluster 3 (Right) -->
  <g class="cluster3">
    <line x1="0" y1="0" x2="-50" y2="35" stroke="#ec4899" class="bg-bond" />
    <line x1="-50" y1="35" x2="15" y2="50" stroke="#14b8a6" class="bg-bond-alt" />
    <line x1="15" y1="50" x2="0" y2="0" stroke="#3b82f6" class="bg-bond" />
    <line x1="0" y1="0" x2="-25" y2="-45" stroke="#8b5cf6" class="bg-bond-alt" />
    <line x1="-50" y1="35" x2="-25" y2="-45" stroke="#ec4899" class="bg-bond" />
    <circle cx="0" cy="0" r="4.5" class="bg-node node-pink" />
    <circle cx="-50" cy="35" r="4.5" class="bg-node node-teal" />
    <circle cx="15" cy="50" r="4.5" class="bg-node node-blue" />
    <circle cx="-25" cy="-45" r="4.5" class="bg-node node-purple" />
  </g>

  <!-- Cluster 4 (Left-Top) -->
  <g class="cluster4">
    <line x1="0" y1="0" x2="70" y2="15" stroke="#14b8a6" class="bg-bond" />
    <circle cx="0" cy="0" r="4.5" class="bg-node node-teal" />
    <circle cx="70" cy="15" r="4.5" class="bg-node node-blue" />
  </g>

  <!-- Cluster 5 (Center-Top) -->
  <g class="cluster5">
    <line x1="0" y1="0" x2="50" y2="-30" stroke="#3b82f6" class="bg-bond" />
    <line x1="50" y1="-30" x2="-30" y2="-40" stroke="#8b5cf6" class="bg-bond-alt" />
    <line x1="-30" y1="-40" x2="0" y2="0" stroke="#ec4899" class="bg-bond" />
    <circle cx="0" cy="0" r="4.5" class="bg-node node-blue" />
    <circle cx="50" cy="-30" r="4.5" class="bg-node node-purple" />
    <circle cx="-30" cy="-40" r="4.5" class="bg-node node-pink" />
  </g>

  <!-- Cluster 6 (Right-Bottom) -->
  <g class="cluster6">
    <line x1="0" y1="0" x2="40" y2="30" stroke="#ec4899" class="bg-bond" />
    <line x1="40" y1="30" x2="-40" y2="40" stroke="#14b8a6" class="bg-bond-alt" />
    <line x1="-40" y1="40" x2="0" y2="0" stroke="#8b5cf6" class="bg-bond" />
    <circle cx="0" cy="0" r="4.5" class="bg-node node-pink" />
    <circle cx="40" cy="30" r="4.5" class="bg-node node-teal" />
    <circle cx="-40" cy="40" r="4.5" class="bg-node node-purple" />
  </g>

  <!-- Cluster 7 (Left-Bottom) -->
  <g class="cluster7">
    <line x1="0" y1="0" x2="50" y2="20" stroke="#14b8a6" class="bg-bond-alt" />
    <circle cx="0" cy="0" r="4.5" class="bg-node node-teal" />
    <circle cx="50" cy="20" r="4.5" class="bg-node node-blue" />
  </g>

  <!-- Content Group (Foreground) -->
  <g transform="translate(60, 65)">
    <!-- Name / Title -->
    <text x="0" y="40" class="title">Naman Trisoliya</text>

    <!-- Subtitle / Role -->
    <text x="0" y="75" class="subtitle">AI Engineer</text>
    
    <!-- Description -->
    <text x="0" y="100" class="desc-text">Specializing in AI Agents, LLM Streaming, RAG &amp; Scalable Data Pipelines</text>
  </g>
</svg>
