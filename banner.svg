<svg width="800" height="250" viewBox="0 0 800 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Glow Effect Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .desc-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #64748b;
    }
    .grid-lines {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.15;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="250" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <circle cx="100" cy="50" r="80" fill="#3b82f6" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="700" cy="200" r="100" fill="#ec4899" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="450" cy="120" r="60" fill="#8b5cf6" opacity="0.1" filter="url(#softGlow)" />

  <!-- Grid Pattern -->
  <g class="grid-lines">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200" />
    <path d="M 100,0 L 100,250 M 200,0 L 200,250 M 300,0 L 300,250 M 400,0 L 400,250 M 500,0 L 500,250 M 600,0 L 600,250 M 700,0 L 700,250" />
  </g>

  <!-- Content Group -->
  <g transform="translate(60, 65)">
    <!-- Name / Title -->
    <text x="0" y="40" class="title">Naman Trisoliya</text>

    <!-- Subtitle / Role -->
    <text x="0" y="75" class="subtitle">AI Engineer</text>
    
    <!-- Description -->
    <text x="0" y="100" class="desc-text">Specializing in AI Agents, LLM Streaming, RAG &amp; Scalable Data Pipelines</text>
  </g>

  <!-- Decorative Graphic Element (Neural Network node representation or code brackets) -->
  <g transform="translate(640, 50)" stroke="#475569" stroke-width="1.5" fill="none" opacity="0.6">
    <!-- Clean AI/Nodes abstract graphic -->
    <circle cx="50" cy="30" r="6" fill="#3b82f6" stroke="#3b82f6" />
    <circle cx="20" cy="80" r="5" fill="#8b5cf6" stroke="#8b5cf6" />
    <circle cx="80" cy="80" r="5" fill="#ec4899" stroke="#ec4899" />
    <circle cx="50" cy="130" r="6" fill="#10b981" stroke="#10b981" />
    
    <line x1="50" y1="36" x2="20" y2="75" stroke="#3b82f6" stroke-width="1" />
    <line x1="50" y1="36" x2="80" y2="75" stroke="#ec4899" stroke-width="1" />
    <line x1="20" y1="85" x2="50" y2="124" stroke="#8b5cf6" stroke-width="1" />
    <line x1="80" y1="85" x2="50" y2="124" stroke="#ec4899" stroke-width="1" />
    
    <!-- Interconnected small dots -->
    <line x1="20" y1="80" x2="80" y2="80" stroke="#475569" stroke-width="0.5" stroke-dasharray="2 2" />
  </g>
</svg>
